# Render Blueprint: the admin demo (the whole app, with sample content).
# In Render: New → Blueprint → pick this repository and the branch
# claude/client-animation-books-plan-grtwcu-gjxlsg, then fill in the values marked "sync: false".
# The demo runs on a paid instance because it needs a disk for the database and uploads.
services:
  - type: web
    name: ninelabs-demo
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install -g pnpm@10.28.0 && pnpm install --frozen-lockfile && pnpm build
    # the disk holds the database (data/), uploaded covers and PDFs (uploads/) and the e-mail outbox
    startCommand: mkdir -p /var/data/uploads && ln -sfn /var/data data && ln -sfn /var/data/uploads uploads && pnpm start -p $PORT
    healthCheckPath: /
    disk:
      name: ninelabs-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: DATABASE_URI
        value: file:/var/data/ninelabs.db
      # demo sign-in: the demo key you choose opens the admin as the first owner below
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_ADMIN_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # the address Render gives the service, e.g. https://ninelabs-demo.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_URL
        sync: false
