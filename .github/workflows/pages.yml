# Publishes the live demo of the website (sample content, nothing is sent) to GitHub Pages.
# The demo is built from src/content/snapshot.json, so it does not need the database.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Live demo (GitHub Pages)

on:
  push:
    branches:
      - claude/client-animation-books-plan-grtwcu-gjxlsg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
